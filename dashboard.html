
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gaze</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>GAZE</h2>

            <nav>
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Settings</a>
            </nav>

            <a href="index.html" class="logout">Logout</a>
        </aside>

        <main class="main-content">

            <header>
                <h1>Dashboard</h1>
                <p>Welcome to your Gaze dashboard.</p>
            </header>

            <section class="cards">

                <div class="dashboard-card">
                    <h3>Users</h3>
                    <p>120</p>
                </div>

                <div class="dashboard-card">
                    <h3>Projects</h3>
                    <p>25</p>
                </div>

                <div class="dashboard-card">
                    <h3>Messages</h3>
                    <p>48</p>
                </div>

            </section>

            <section class="welcome-box">
                <h2>Welcome!</h2>
                <p>
                    You have successfully logged in to your dashboard.
                </p>
            </section>

        </main>

    </div>

</body>
</html>
